<div class="add-new-refund-content">
    <div class="add-new-refund-title">
        <h3>Ajouter un nouveau remboursement</h3>
    </div>
    <div class="add-new-refund">
        <form [formGroup]="newRefundForm" (ngSubmit)="addNewRefund()" class="new-refund-form">
            <mat-form-field>
                <mat-label>Libellé</mat-label>
                <input matInput formControlName="wording">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Montants</mat-label>
                <input matInput type="number" formControlName="amount">
                <span matTextSuffix>€&nbsp;</span>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Date</mat-label>
                <input matInput [matDatepicker]="dp" formControlName="date" (dateChange)="dateSelected($event)" />
                <mat-hint>DD/MM/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="dp"></mat-datepicker-toggle>
                <mat-datepicker #dp></mat-datepicker>
            </mat-form-field>
            <button mat-raised-button type="submit" [disabled]="!newRefundForm.valid">Ajouter</button>
        </form>
    </div>
</div>
